# Determinism rules for the domain crates (see docs/system-design.md, sections 1.3 and 2.3).
# Adapter crates that need any of these can override with their own clippy.toml.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet" },
    { path = "std::time::Instant", reason = "time is an input: use the simulation clock" },
    { path = "std::time::SystemTime", reason = "time is an input: use the simulation clock" },
]

disallowed-methods = [
    { path = "f64::ln", reason = "not bit-identical across targets; use libm" },
    { path = "f64::log", reason = "not bit-identical across targets; use libm" },
    { path = "f64::log2", reason = "not bit-identical across targets; use libm" },
    { path = "f64::log10", reason = "not bit-identical across targets; use libm" },
    { path = "f64::ln_1p", reason = "not bit-identical across targets; use libm" },
    { path = "f64::exp", reason = "not bit-identical across targets; use libm" },
    { path = "f64::exp2", reason = "not bit-identical across targets; use libm" },
    { path = "f64::exp_m1", reason = "not bit-identical across targets; use libm" },
    { path = "f64::powf", reason = "not bit-identical across targets; use libm" },
    { path = "f64::powi", reason = "not bit-identical across targets; use libm" },
    { path = "f64::cbrt", reason = "not bit-identical across targets; use libm" },
    { path = "f64::hypot", reason = "not bit-identical across targets; use libm" },
    { path = "f64::sin", reason = "not bit-identical across targets; use libm" },
    { path = "f64::cos", reason = "not bit-identical across targets; use libm" },
    { path = "f64::tan", reason = "not bit-identical across targets; use libm" },
    { path = "f64::asin", reason = "not bit-identical across targets; use libm" },
    { path = "f64::acos", reason = "not bit-identical across targets; use libm" },
    { path = "f64::atan", reason = "not bit-identical across targets; use libm" },
    { path = "f64::atan2", reason = "not bit-identical across targets; use libm" },
    { path = "f64::sinh", reason = "not bit-identical across targets; use libm" },
    { path = "f64::cosh", reason = "not bit-identical across targets; use libm" },
    { path = "f64::tanh", reason = "not bit-identical across targets; use libm" },
    { path = "f64::mul_add", reason = "fused or not depending on target; keep arithmetic explicit" },
]
